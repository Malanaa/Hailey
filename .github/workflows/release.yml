name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package version
        run: node -e "if ('v' + JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - name: Publish versioned package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hailey-lang-*.tgz dist/SHA256SUMS.txt --verify-tag --title "Hailey $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
